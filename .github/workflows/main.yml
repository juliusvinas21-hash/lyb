name: Build Kernel (Performance - vayu 4.14)

on:
  workflow_dispatch:
  push:
    branches: [ HEAD ]
  pull_request:
    branches: [ HEAD ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      KERNEL_DEFCONFIG: vayu_user_defconfig
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils bc bison flex make \
            python3 python2 \
            libssl-dev build-essential \
            unzip xz-utils cpio \
            device-tree-compiler \
            git git-lfs curl wget

          if ! command -v python2 >/dev/null; then
            sudo ln -sf /usr/bin/python3 /usr/bin/python2
          fi

      - name: Clone Android Clang (AOSP)
        run: |
          git clone --depth=1 https://github.com/Kry9toN/clang.git clang
          echo "$(pwd)/clang/clang-r450784d/bin" >> $GITHUB_PATH

      - name: Fix mkdtboimg.py (Python3)
        run: |
          MKDTBO_PATH="scripts/dtc/libfdt/mkdtboimg.py"
          curl -L "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT" \
            | base64 --decode > "$MKDTBO_PATH"
          chmod +x "$MKDTBO_PATH"

      - name: Build defconfig
        run: |
          make ARCH=arm64 O=out \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            $KERNEL_DEFCONFIG

      - name: Build kernel Image + dtbo
        run: |
          make ARCH=arm64 O=out \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc) \
            Image dtbo.img

      - name: Verify compiler
        run: |
          grep CONFIG_CC_VERSION_TEXT out/.config

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: Performance-Kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            out/.config
